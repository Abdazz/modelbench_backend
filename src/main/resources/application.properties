spring.application.name=modelbench
spring.profiles.active=postgres

server.port=8090
server.forward-headers-strategy=framework

spring.jpa.open-in-view=false
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

springdoc.swagger-ui.path=/swagger
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.path=/v3/api-docs

security.jwt.secret=${JWT_SECRET:cle-de-developpement-modelbench-a-remplacer-en-production-2026}
security.jwt.duree-validite-secondes=28800

app.cors.origines=http://localhost:4200
