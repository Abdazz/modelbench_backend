services:
  postgres:
    image: postgres:16-alpine
    container_name: modelbench-postgres
    environment:
      POSTGRES_DB: model_bench_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - modelbench-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d model_bench_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  modelbench-data:
